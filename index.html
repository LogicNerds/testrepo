<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortune 8 Ball</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hammersmith+One&family=Montserrat:wght@300;400&family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* HEADER - stays at top center */
        .header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
        }

        .header h1 {
            color: #ffffff;
            font-size: 45px;
            font-weight: 400;
            font-family: 'Hammersmith One', sans-serif;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .header h2 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 400;
            font-family: 'Dancing Script';
            letter-spacing: 3px;
            font-style: italic;
        }

        /* DESKTOP: 2-COLUMN LAYOUT */
        .main-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: justify-content: center;
            width: 100%;
            max-width: 1100px;
            padding: 20px;
            gap: 60px;
        }

        .left-column {
            flex: 0 0 auto;
        }

        .right-column {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .right-text {
            text-align: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 300;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            line-height: 1.3;
        }

        .desktop-buttons {
            display: flex;
            flex-direction: row;
            gap: 20px;
        }

        /* BALL */
        #ball {
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background-image: url('https://raw.githubusercontent.com/LogicNerds/8ball/main/8ballassets/8ball.png');
            background-size: cover;
            background-position: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s ease;
            user-select: none;
            overflow: hidden;
        }

        #ball:active {
            transform: scale(0.98);
        }

        #ball.shaking {
            animation: shake 0.6s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(-8px, -6px) rotate(-2deg); }
            20% { transform: translate(9px, 5px) rotate(1.5deg); }
            30% { transform: translate(-7px, 8px) rotate(-1deg); }
            40% { transform: translate(10px, -7px) rotate(2deg); }
            50% { transform: translate(-9px, 6px) rotate(-1.5deg); }
            60% { transform: translate(7px, -8px) rotate(1deg); }
            70% { transform: translate(-6px, 9px) rotate(-0.5deg); }
            80% { transform: translate(5px, -5px) rotate(0.5deg); }
            90% { transform: translate(-3px, 4px) rotate(-0.25deg); }
        }

        /* TRIANGLE */
        #triangle-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) rotate(180deg);
            opacity: 0;
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #triangle-container.floating {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 1;
        }

        #triangle-container.hiding {
            transform: translate(-50%, -50%) scale(0) rotate(-180deg);
            opacity: 0;
            transition: all 0.6s ease;
        }

        #triangle-svg {
            display: block;
            width: 150px;
            height: auto;
            opacity: 0.85;
        }

        #message-container {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -40%);
            width: 65px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #message-container.visible {
            opacity: 1;
        }

        #fortune {
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.3;
            font-family: 'Arial Narrow', 'Roboto Condensed', 'PT Sans Narrow', 'Franklin Gothic Medium', Arial, sans-serif;
        }

        /* BUTTONS */
        .impact-button {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .impact-button:hover {
            transform: scale(1.05);
        }

        .impact-button img {
            display: block;
            width: 220px;
            height: auto;
        }

        /* Hide mobile elements on desktop */
        .mobile-only {
            display: none;
        }

        /* MOBILE LAYOUT */
        @media (max-width: 768px) {
            .header {
                margin-bottom: 0px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header h2 {
                font-size: 18px;
            }

            .main-container {
                flex-direction: column;
                gap: 0px;
                padding: 10px;
            }

            .left-column {
                width: 100%;
                display: flex;
                justify-content: center;
            }

            /* Hide desktop right column on mobile */
            .right-column {
                display: none;
            }

            #ball {
                width: 350px;
                height: 350px;
            }

            #triangle-svg {
                width: 95px;
            }

            #message-container {
                width: 52px;
            }

            #fortune {
                font-size: 9px;
            }

            /* Show mobile elements */
            .mobile-only {
                display: block;
                width: 100%;
            }

            /* Mobile text */
            .mobile-text {
                text-align: center;
                color: #ffffff;
                font-size: 16px;
                font-weight: 300;
                font-family: 'Montserrat', sans-serif;
                letter-spacing: 1px;
                line-height: 1.3;
                margin-top: 20px;
                margin-bottom: 0px;
            }

            /* Grid layout for mobile buttons */
            .mobile-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0px;
                width: 100%;
                margin-top: 0px;
                justify-items: center;
            }

            .mobile-buttons .impact-button img {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Header stays at top center -->
    <div class="header">
        <h1>HAVE A STRATEGY QUESTION?</h1>
        <h2>Ask the Magic Vibes Ball</h2>
    </div>

    <!-- Main 2-column container -->
    <div class="main-container">
        <!-- LEFT COLUMN: Ball -->
        <div class="left-column">
            <div id="ball">
                <div id="triangle-container">
                    <svg id="triangle-svg" viewBox="0 0 180 156">
                        <polygon points="90,0 180,156 0,156" fill="#1e3a8a" />
                    </svg>
                    <div id="message-container">
                        <div id="fortune"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: Text + Buttons (Desktop only) -->
        <div class="right-column">
            <div class="right-text">
                LOOKING FOR MORE ACTIONABLE<br>ANSWERS & SOLUTIONS?
            </div>
            <div class="desktop-buttons">
                <a href="#" class="impact-button">
                    <img src="https://raw.githubusercontent.com/LogicNerds/8ball/main/8ballassets/impactbutton-dropin.png" alt="Drop-in Marketing Strategy Sessions">
                </a>
                <a href="#" class="impact-button">
                    <img src="https://raw.githubusercontent.com/LogicNerds/8ball/main/8ballassets/impactbutton-full.png" alt="Full Suite of Marketing Services">
                </a>
            </div>
        </div>

        <!-- MOBILE ONLY: Text + Buttons -->
        <div class="mobile-only">
            <div class="mobile-text">
                LOOKING FOR MORE ACTIONABLE<br>ANSWERS & SOLUTIONS?
            </div>
            <div class="mobile-buttons">
                <a href="#" class="impact-button">
                    <img src="https://raw.githubusercontent.com/LogicNerds/8ball/main/8ballassets/impactbutton-dropin.png" alt="Drop-in Marketing Strategy Sessions">
                </a>
                <a href="#" class="impact-button">
                    <img src="https://raw.githubusercontent.com/LogicNerds/8ball/main/8ballassets/impactbutton-full.png" alt="Full Suite of Marketing Services">
                </a>
            </div>
        </div>
    </div>

    <script>
        const fortunes = [
            "Trust your gut", "The stars are aligned", "Your future looks bright",
            "Follow your own path", "Do what you love", "My sources say yes",
            "Good things are ahead", "Pursue your passion", "You are growing",
            "Signs point to yes", "Fuck yes!", "Try again", "Sure", "Damn straight",
            "The vibes are good", "Fuck it!", "You do you", "You're killin' it",
            "Hell yeah!", "Absolutely", "Yes, definitely", "Signs say yes",
            "Sources say yes", "Outlook good", "Most likely", "You got this",
            "Trust yourself", "Follow through", "Do it now", "Just do it",
            "Better not tell", "Cannot predict", "Proceed with care", "Take the leap",
            "Hold your horses", "Small wins", "Big energy", "New doors open",
            "Good things ahead", "Keep going", "Keep the faith", "Trust your gut",
            "The vibes align", "Stars are aligned", "Change is coming", "Embrace change",
            "Recalibrate", "Shift your focus", "Protect your peace", "Opportunity knocks",
            "Follow joy", "Pursue passion", "You're growing", "Level up", "Burn bright",
            "Ride the wave", "Stay curious", "Be bold", "Aim higher", "Quiet the noise",
            "Take a breath", "All systems go", "Full speed ahead", "Not the one",
            "Pass for now", "Revisit later", "Why not?", "Sparks will fly",
            "The universe nods", "Orbit aligns", "Cosmos says yes", "Galactic green light",
            "Star-synced", "Thumbs up", "Astral thumbs up", "Make noise", "Chaos-approved",
            "Change the game", "Go break norms", "Passion approved", "Give yourself grace",
            "Permission granted", "Most likely", "No doubt", "Go ahead", "Maybe soon",
            "Damn straight", "Make noise", "Wild card", "Full throttle", "Go wild",
            "Chaos approved", "Do the math", "Trust the data", "Test and learn",
            "Go for it", "Green light", "Make it happen", "Let's go", "Onward",
            "Do the thing", "Game on", "Maybe later", "Ask again later", "Give it time",
            "Could be", "Time will tell", "Watch this space", "Try again", "Hold up",
            "Hold steady", "Revisit this", "Wait", "Not sure yet", "See how it goes",
            "Take your time", "Reflect", "Damn right", "Test it", "Nope", "Maybe",
            "Perhaps", "It is certain"
        ];

        const ball = document.getElementById('ball');
        const triangleContainer = document.getElementById('triangle-container');
        const messageContainer = document.getElementById('message-container');
        const fortuneEl = document.getElementById('fortune');

        let isVisible = false;
        let lastFortuneIndex = -1;
        let isAnimating = false;

        function getRandomFortune() {
            let index;
            do {
                index = Math.floor(Math.random() * fortunes.length);
            } while (index === lastFortuneIndex && fortunes.length > 1);
            
            lastFortuneIndex = index;
            return fortunes[index];
        }

        function showFortune() {
            if (isAnimating) return;
            isAnimating = true;

            const fortune = getRandomFortune();
            fortuneEl.textContent = fortune;
            
            ball.classList.add('shaking');
            
            setTimeout(() => {
                ball.classList.remove('shaking');
                triangleContainer.classList.remove('hiding');
                triangleContainer.classList.add('floating');
                
                setTimeout(() => {
                    messageContainer.classList.add('visible');
                    isAnimating = false;
                }, 800);
            }, 600);
            
            isVisible = true;
        }

        function hideFortune() {
            if (isAnimating) return;
            
            messageContainer.classList.remove('visible');
            triangleContainer.classList.remove('floating');
            triangleContainer.classList.add('hiding');
            isVisible = false;
        }

        ball.addEventListener('click', () => {
            if (isVisible) {
                hideFortune();
            } else {
                showFortune();
            }
        });
    </script>
</body>
</html>
